name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: worker/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests && ruff format --check app tests
      - run: pytest -q

  backend-postgis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: aapda_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@localhost:5432/aapda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: worker/requirements-dev.txt }
      - run: pip install -r worker/requirements-dev.txt
      - run: python scripts/apply_migrations.py "$TEST_DATABASE_URL" --local-shim --seed
      - run: pytest -q
        working-directory: worker

  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix: { project: [app, dashboard] }
    defaults: { run: { working-directory: "${{ matrix.project }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
