[project]
name = "aapdasaathi-worker"
version = "1.0.0"
description = "AapdaSaathi backend: FastAPI API, SACHET ingestion, escalation and dispatch worker"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
