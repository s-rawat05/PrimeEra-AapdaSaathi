# Supabase CLI configuration (https://supabase.com/docs/guides/local-development/cli/config)
project_id = "primeera-aapdasaathi"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8080"
jwt_expiry = 3600
enable_signup = true

[auth.sms]
# Phone OTP for residents. Configure a provider in the Supabase dashboard; never commit credentials.
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = false
